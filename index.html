<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืม-คืนเครื่องมือ | Equipment Rental</title>
<!-- Google Fonts: Plus Jakarta Sans & Noto Sans Thai -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* Midnight Navy & Champagne Gold Luxury Palette */
    --bg: #0b1325;
    --card-bg: rgba(18, 28, 51, 0.7);
    --card-border: rgba(212, 175, 55, 0.15);
    --card-hover: rgba(212, 175, 55, 0.3);
    
    --text-main: #f0f4f8;
    --text-muted: #8a9bb8;
    
    /* Brand Colors - Navy Blue & Champagne Gold Accent */
    --brand-primary: #3b82f6;
    --brand-glow: rgba(59, 130, 246, 0.25);
    --brand-gradient: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 50%, #60a5fa 100%);
    
    --gold-primary: #d4af37;
    --gold-gradient: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f3e5ab 100%);
    --gold-glow: rgba(212, 175, 55, 0.25);
    
    /* Status Colors */
    --free-bg: rgba(59, 130, 246, 0.12);
    --free-border: rgba(59, 130, 246, 0.3);
    --free-text: #60a5fa;
    
    --busy-bg: rgba(212, 175, 55, 0.12);
    --busy-border: rgba(212, 175, 55, 0.3);
    --busy-text: #f3e5ab;
    
    --bad: #f87171;
    --bad-bg: rgba(239, 68, 68, 0.15);
    
    --glass-bg: rgba(11, 19, 37, 0.8);
    --glass-border: rgba(255, 255, 255, 0.08);
    --shadow-luxury: 0 12px 32px -4px rgba(0, 0, 0, 0.6), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 10% 10%, rgba(29, 78, 216, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
    background-attachment: fixed;
  }

  button, input, textarea { 
    font-family: inherit; 
    color: inherit; 
    outline: none;
  }

  /* Header Section */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
    padding: 16px 20px 12px;
    padding-top: max(16px, env(safe-area-inset-top));
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(135deg, #ffffff 30%, #f3e5ab 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    padding: 4px 10px;
    border-radius: 99px;
  }

  .who {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .icon-btn {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: var(--gold-primary);
  }

  /* Navigation Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    background: rgba(0, 0, 0, 0.3);
    padding: 4px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.03);
  }

  .tab {
    flex: 1;
    padding: 10px 12px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text-muted);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tab[aria-selected="true"] {
    background: var(--gold-gradient);
    color: #0b1325;
    font-weight: 700;
    box-shadow: 0 4px 12px var(--gold-glow);
  }

  /* Tools & Search Controls */
  .tools {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .search-wrapper {
    position: relative;
    flex: 1;
  }

  .search {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 1px solid var(--glass-border);
    background: rgba(0, 0, 0, 0.3);
    border-radius: 12px;
    color: var(--text-main);
    font-size: 0.88rem;
    transition: all 0.2s;
  }
  .search:focus {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    background: var(--brand-gradient);
    color: #ffffff;
    box-shadow: 0 4px 14px var(--brand-glow);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--glass-border); box-shadow: none; }
  .btn.warn { background: var(--gold-gradient); box-shadow: 0 4px 14px var(--gold-glow); color: #0b1325; }

  .row2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 12px 0 4px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .chips { display: flex; gap: 6px; }
  .chip {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 99px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .chip[aria-pressed="true"] {
    background: rgba(212, 175, 55, 0.15);
    border-color: var(--gold-primary);
    color: #f3e5ab;
    font-weight: 600;
  }

  label.cont {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  label.cont input { accent-color: var(--gold-primary); }

  /* Main Equipment List */
  main {
    padding: 16px;
    padding-bottom: 230px;
    max-width: 800px;
    margin: 0 auto;
  }

  .card {
    width: 100%;
    text-align: left;
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-luxury);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--card-hover);
    transform: translateY(-2px);
  }
  .card[aria-disabled="true"] {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.5);
  }
  .card.sel {
    border-color: var(--gold-primary);
    background: rgba(212, 175, 55, 0.08);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  .tick {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--glass-border);
    display: grid;
    place-items: center;
    font-size: 0.75rem;
    font-weight: 800;
    color: transparent;
    transition: all 0.2s;
  }
  .card.sel .tick {
    background: var(--gold-primary);
    border-color: var(--gold-primary);
    color: #0b1325;
  }

  .info { flex: 1; min-width: 0; }
  .name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
    display: block;
  }
  .code {
    font-family: 'Plus Jakarta Sans', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.08);
    color: #f3e5ab;
    border-radius: 6px;
    padding: 2px 8px;
    letter-spacing: 0.5px;
  }

  .pill {
    flex: none;
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 99px;
    padding: 4px 12px;
    white-space: nowrap;
    letter-spacing: 0.3px;
    border: 1px solid transparent;
  }
  .pill.free {
    background: var(--free-bg);
    color: var(--free-text);
    border-color: var(--free-border);
  }
  .pill.busy {
    background: var(--busy-bg);
    color: var(--busy-text);
    border-color: var(--busy-border);
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-weight: 500;
  }

  /* Bottom Drawer Bar */
  #bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    padding: 14px 20px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    max-width: 800px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
  }

  .sum {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .basket {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    max-height: 80px;
    overflow-y: auto;
  }
  .bchip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 3px 6px 3px 12px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .bchip button {
    border: 0;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    cursor: pointer;
    font-size: 0.8rem;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .bchip button:hover { background: var(--bad); color: #fff; }

  #note {
    width: 100%;
    border: 1px solid var(--glass-border);
    background: rgba(0, 0, 0, 0.3);
    color: var(--text-main);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    resize: none;
    font-size: 0.85rem;
  }
  #note:focus { border-color: var(--gold-primary); }

  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; padding: 12px; }

  /* Toast Notification */
  #toast {
    position: fixed;
    left: 50%;
    top: max(20px, env(safe-area-inset-top));
    transform: translateX(-50%);
    background: rgba(18, 28, 51, 0.95);
    border: 1px solid var(--gold-primary);
    color: var(--text-main);
    padding: 12px 20px;
    border-radius: 99px;
    font-size: 0.88rem;
    font-weight: 600;
    z-index: 50;
    max-width: 90vw;
    display: none;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
  }
  #toast.err {
    border-color: var(--bad);
    background: rgba(40, 15, 20, 0.95);
    color: #fca5a5;
  }

  /* Modal & Bottom Sheet */
  #modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #modal.open { display: flex; }

  .sheet {
    background: #0e172a;
    border: 1px solid var(--glass-border);
    width: 100%;
    max-width: 560px;
    border-radius: 24px 24px 0 0;
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow-luxury);
  }
  .sheet h2 {
    margin: 0 0 16px;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .res {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--glass-border);
    font-size: 0.9rem;
  }
  .res:last-of-type { border-bottom: 0; }
  .res .mark { flex: none; font-weight: 800; font-size: 1.1rem; }
  .res.ok .mark { color: var(--free-text); }
  .res.fail .mark { color: var(--bad); }

  .fatal {
    margin: 60px 20px;
    padding: 24px;
    background: var(--card-bg);
    border: 1px solid var(--bad);
    border-radius: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>ยืม-คืนเครื่องมือ</h1>
    <div class="user-badge">
      <span class="who" id="who">กำลังโหลด...</span>
      <button class="icon-btn" id="refresh" title="รีเฟรช" aria-label="รีเฟรช">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/></svg>
      </button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-all" aria-selected="true">เครื่องมือทั้งหมด</button>
    <button class="tab" role="tab" id="tab-mine" aria-selected="false">ของฉัน (<span id="mineCount">0</span>)</button>
  </div>

  <div class="tools">
    <div class="search-wrapper">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search" id="q" type="search" placeholder="ค้นหา ชื่อ / รหัส / S/N / หมวดหมู่" autocomplete="off">
    </div>
    <button class="btn" id="scan" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      สแกน QR
    </button>
  </div>

  <div class="row2">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">ทั้งหมด</button>
      <button class="chip" data-f="free" aria-pressed="false">ว่าง</button>
      <button class="chip" data-f="busy" aria-pressed="false">ถูกยืม</button>
    </div>
    <label class="cont" id="contWrap" hidden>
      <input type="checkbox" id="cont" checked> สแกนต่อเนื่อง
    </label>
  </div>
</header>

<main id="list"><div class="empty">กำลังโหลดข้อมูล…</div></main>

<div id="bar" hidden>
  <div class="sum">
    <span id="sumText"></span>
    <button class="btn ghost" id="clear" style="padding: 4px 10px; font-size: 0.75rem;">ล้างรายการ</button>
  </div>
  <div class="basket" id="basket"></div>
  <textarea id="note" rows="2" maxlength="300" placeholder="หมายเหตุตอนคืน (ถ้ามี) เช่น สภาพเครื่อง ชำรุด ขาดอุปกรณ์" hidden></textarea>
  <div class="actions">
    <button class="btn" id="doBorrow" hidden></button>
    <button class="btn warn" id="doReturn" hidden></button>
  </div>
</div>

<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ============ ตั้งค่า 2 ค่านี้ก่อนใช้งาน ============
var CONFIG = {
  LIFF_ID: '2012136670-ldgkMBdO', 
  API_URL: 'https://script.google.com/macros/s/AKfycbyo_K-TgkVOC2Vb3ADbfe8kxWNFDH4Kw6ZXLCzypANRvW0F7HPgBHg4569enGf8Ul9kBg/exec' 
};
// ===================================================

(function () {
  'use strict';

  var ERRORS = {
    NO_TOKEN: 'ไม่พบ ID token ตรวจว่า LIFF ตั้ง Scope openid และ profile แล้ว',
    INVALID_TOKEN: 'ยืนยันตัวตนไม่สำเร็จ ตรวจว่า LIFF ID ในชีต Config ช่อง B3 ตรงกับที่ใช้ในหน้านี้',
    LIFF_NOT_CONFIGURED: 'ยังไม่ได้ใส่ LIFF ID ในชีต Config ช่อง B3',
    BAD_REQUEST: 'คำขอไม่ถูกต้อง',
    TOO_MANY_ITEMS: 'เลือกได้ครั้งละไม่เกิน 30 ชิ้น',
    UNKNOWN_ACTION: 'คำสั่งไม่ถูกต้อง'
  };

  var state = {
    tools: [], me: { name: '', isAdmin: false },
    tab: 'all', filter: 'all', q: '',
    basket: [], 
    busy: false, canScan: false, scanning: false
  };

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- ข้อความแจ้งเตือน ----------
  var toastTimer = null;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = isErr ? 'err' : '';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, isErr ? 4500 : 2200);
  }
  function fatal(msg) {
    document.body.innerHTML = '<div class="fatal"><h3 style="margin:0 0 10px;color:var(--bad)">ใช้งานไม่ได้</h3><p>' + esc(msg) + '</p></div>';
  }

  // ---------- เรียก API (Apps Script) ----------
  function relogin() {
    try { liff.logout(); } catch (e) {}
    liff.login({ redirectUri: location.href });
  }

  async function api(action, payload) {
    var body = Object.assign({ action: action, idToken: liff.getIDToken() }, payload || {});
    var res;
    try {
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตและ API_URL แล้วลองใหม่');
    }
    var data;
    try { data = await res.json(); } catch (e) {
      throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ ตรวจว่า Deploy เป็น Web app แบบ Anyone');
    }
    if (!data.ok) {
      if (data.error === 'TOKEN_EXPIRED') {
        relogin();
        throw new Error('เซสชันหมดอายุ กำลังเข้าสู่ระบบใหม่…');
      }
      throw new Error(ERRORS[data.error] || data.error || 'เกิดข้อผิดพลาด');
    }
    return data;
  }

  // ---------- ข้อมูล ----------
  function findTool(id) {
    var k = String(id).trim().toLowerCase();
    for (var i = 0; i < state.tools.length; i++) {
      if (state.tools[i].id.toLowerCase() === k) return state.tools[i];
    }
    return null;
  }
  function kindOf(t) {
    if (!t.busy) return 'free';
    if (t.mine) return 'mine';
    return state.me.isAdmin ? 'admin' : 'other';
  }

  async function refresh() {
    var d = await api('list');
    state.me = d.user;
    state.tools = d.tools;
    state.basket = state.basket.filter(function (id) {
      var t = findTool(id);
      return t && kindOf(t) !== 'other';
    });
    render();
  }

  // ---------- วาดหน้าจอ ----------
  function visibleTools() {
    var q = state.q.trim().toLowerCase();
    return state.tools.filter(function (t) {
      if (state.tab === 'mine') return t.mine;
      if (state.filter === 'free' && t.busy) return false;
      if (state.filter === 'busy' && !t.busy) return false;
      if (!q) return true;
      return (t.id + ' ' + t.name + ' ' + t.cat + ' ' + t.sn + ' ' + t.borrower).toLowerCase().indexOf(q) >= 0;
    });
  }

  function render() {
    $('#who').textContent = state.me.name + (state.me.isAdmin ? ' (Admin)' : '');
    $('#mineCount').textContent = state.tools.filter(function (t) { return t.mine; }).length;
    $('#tab-all').setAttribute('aria-selected', state.tab === 'all');
    $('#tab-mine').setAttribute('aria-selected', state.tab === 'mine');
    $('#chips').style.display = state.tab === 'all' ? 'flex' : 'none';

    var list = visibleTools();
    var html = list.map(function (t) {
      var kind = kindOf(t);
      var sel = state.basket.indexOf(t.id) >= 0;
      var disabled = kind === 'other';
      var pill = t.busy
        ? '<span class="pill busy">' + (t.mine ? 'คุณยืมอยู่' : 'ถูกยืม') + '</span>'
        : '<span class="pill free">ว่าง</span>';
      var line2 = [];
      if (t.cat) line2.push(esc(t.cat));
      if (t.sn) line2.push('S/N: ' + esc(t.sn));
      var line3 = t.busy ? 'ผู้ยืม: ' + esc(t.borrower) + ' · ตั้งแต่ ' + esc(t.since) : '';
      return '<button class="card' + (sel ? ' sel' : '') + '" data-id="' + esc(t.id) + '"' +
        (disabled ? ' aria-disabled="true"' : '') + '>' +
        '<span class="tick">✓</span>' +
        '<span class="info"><span class="name"><span class="code">' + esc(t.id) + '</span>' + esc(t.name) + '</span>' +
        (line2.length ? '<span class="meta">' + line2.join(' · ') + '</span>' : '') +
        (line3 ? '<span class="meta" style="color:var(--busy-text)">' + line3 + '</span>' : '') + '</span>' + pill + '</button>';
    }).join('');
    $('#list').innerHTML = html ||
      '<div class="empty">' + (state.tab === 'mine' ? 'คุณไม่ได้ยืมเครื่องมือใดอยู่' : 'ไม่พบเครื่องมือที่ตรงกับเงื่อนไข') + '</div>';
    renderBar();
  }

  function splitBasket() {
    var borrow = [], ret = [];
    state.basket.forEach(function (id) {
      var t = findTool(id);
      if (!t) return;
      var k = kindOf(t);
      if (k === 'free') borrow.push(t.id);
      else if (k === 'mine' || k === 'admin') ret.push(t.id);
    });
    return { borrow: borrow, ret: ret };
  }

  function renderBar() {
    var bar = $('#bar');
    var n = state.basket.length;
    bar.hidden = n === 0;
    document.querySelector('main').style.paddingBottom = n ? '240px' : '24px';
    if (!n) return;
    var s = splitBasket();
    $('#sumText').textContent = 'เลือกทั้งหมด ' + n + ' รายการ';
    $('#basket').innerHTML = state.basket.map(function (id) {
      return '<span class="bchip">' + esc(id) + '<button data-rm="' + esc(id) + '" aria-label="เอาออก">✕</button></span>';
    }).join('');
    var b = $('#doBorrow'), r = $('#doReturn');
    b.hidden = s.borrow.length === 0;
    r.hidden = s.ret.length === 0;
    b.textContent = 'ยืนยันยืม (' + s.borrow.length + ')';
    r.textContent = 'ยืนยันคืน (' + s.ret.length + ')';
    b.disabled = r.disabled = state.busy;
    $('#note').hidden = s.ret.length === 0;
  }

  // ---------- ตะกร้า ----------
  function toggle(id) {
    var i = state.basket.indexOf(id);
    if (i >= 0) state.basket.splice(i, 1); else state.basket.push(id);
    render();
  }

  function addScanned(raw) {
    var id = parseToolId(raw, false);
    var t = findTool(id);
    if (!t) { toast('ไม่พบเครื่องมือ: ' + id, true); return false; }
    if (kindOf(t) === 'other') { toast(t.id + ' ถูกยืมโดย ' + t.borrower, true); return false; }
    if (state.basket.indexOf(t.id) >= 0) { toast(t.id + ' อยู่ในรายการแล้ว'); return true; }
    state.basket.push(t.id);
    render();
    toast('เพิ่ม ' + t.id + ' ' + t.name + (t.busy ? ' (คืน)' : ' (ยืม)'));
    return true;
  }

  function parseToolId(v, strict) {
    v = String(v == null ? '' : v).trim();
    try {
      var u = new URL(v);
      var t = u.searchParams.get('tool');
      if (t) return t.trim();
      var st = u.searchParams.get('liff.state');
      if (st) {
        var m = decodeURIComponent(st).match(/[?&]tool=([^&]+)/);
        if (m) return decodeURIComponent(m[1]).trim();
      }
      var m2 = decodeURIComponent(u.search.replace(/^\?/, '')).match(/^TOOL\s*[:：]\s*(.+)$/i);
      if (m2) return m2[1].trim();
      if (strict) return null;
    } catch (e) { if (strict) return null; }
    var m3 = v.match(/^TOOL\s*[:：]\s*(.+)$/i);
    if (m3) return m3[1].trim();
    return strict ? null : v;
  }

  // ---------- สแกน QR ----------
  async function startScan() {
    if (state.scanning || !state.canScan) return;
    state.scanning = true;
    try {
      do {
        var r;
        try { r = await liff.scanCodeV2(); } catch (e) { break; }
        if (!r || !r.value) break;
        addScanned(r.value);
        await new Promise(function (ok) { setTimeout(ok, 350); });
      } while ($('#cont').checked);
    } finally {
      state.scanning = false;
    }
  }

  // ---------- ยืม / คืน ----------
  async function submit(kind) {
    if (state.busy) return;
    var s = splitBasket();
    var ids = kind === 'borrow' ? s.borrow : s.ret;
    if (!ids.length) return;
    state.busy = true;
    renderBar();
    try {
      var payload = { ids: ids };
      if (kind === 'return') payload.note = $('#note').value.trim();
      var d = await api(kind, payload);
      state.basket = state.basket.filter(function (id) { return ids.indexOf(id) < 0; });
      if (kind === 'return') $('#note').value = '';
      showResults(kind, d.results);
      await refresh();
    } catch (e) {
      toast(e.message, true);
    } finally {
      state.busy = false;
      renderBar();
    }
  }

  function showResults(kind, results) {
    var ok = results.filter(function (r) { return r.ok; }).length;
    var html = '<h2>' + (kind === 'borrow' ? 'ผลการยืม' : 'ผลการคืน') + ' · สำเร็จ ' + ok + '/' + results.length + '</h2>' +
      results.map(function (r) {
        return '<div class="res ' + (r.ok ? 'ok' : 'fail') + '"><span class="mark">' + (r.ok ? '✓' : '✕') + '</span><span>' +
          '<b>' + esc(r.id) + '</b> ' + esc(r.name || '') + '<br><span style="color:var(--text-muted)">' + esc(r.msg) + '</span></span></div>';
      }).join('') +
      '<div style="margin-top:20px"><button class="btn" id="closeModal" style="width:100%">ปิดหน้าต่าง</button></div>';
    $('#sheet').innerHTML = html;
    $('#modal').classList.add('open');
  }

  // ---------- เหตุการณ์ ----------
  $('#list').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    if (card.getAttribute('aria-disabled') === 'true') {
      var t = findTool(card.getAttribute('data-id'));
      if (t) toast(t.id + ' ถูกยืมโดย ' + t.borrower);
      return;
    }
    toggle(card.getAttribute('data-id'));
  });
  $('#basket').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]');
    if (b) toggle(b.getAttribute('data-rm'));
  });
  $('#clear').addEventListener('click', function () { state.basket = []; render(); });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  $('#tab-all').addEventListener('click', function () { state.tab = 'all'; render(); });
  $('#tab-mine').addEventListener('click', function () { state.tab = 'mine'; render(); });
  $('#chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    state.filter = c.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) {
      x.setAttribute('aria-pressed', x === c ? 'true' : 'false');
    });
    render();
  });
  $('#refresh').addEventListener('click', function () {
    refresh().then(function () { toast('อัปเดตข้อมูลแล้ว'); }).catch(function (e) { toast(e.message, true); });
  });
  $('#scan').addEventListener('click', startScan);
  $('#doBorrow').addEventListener('click', function () { submit('borrow'); });
  $('#doReturn').addEventListener('click', function () { submit('return'); });
  $('#modal').addEventListener('click', function (e) {
    if (e.target.id === 'modal' || e.target.id === 'closeModal') $('#modal').classList.remove('open');
  });

  // ---------- เริ่มทำงาน ----------
  async function main() {
    if (/ใส่/.test(CONFIG.LIFF_ID) || /ใส่/.test(CONFIG.API_URL)) {
      fatal('ยังไม่ได้ตั้งค่า LIFF_ID และ API_URL ในไฟล์ index.html');
      return;
    }
    try {
      await liff.init({ liffId: CONFIG.LIFF_ID });
    } catch (e) {
      fatal('เริ่มต้น LIFF ไม่สำเร็จ: ' + (e && e.message ? e.message : e));
      return;
    }
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

    state.canScan = !!(liff.isInClient() && liff.isApiAvailable('scanCodeV2'));
    $('#scan').hidden = !state.canScan;
    $('#contWrap').hidden = !state.canScan;

    try {
      await refresh();
    } catch (e) {
      $('#list').innerHTML = '<div class="empty" style="color:var(--bad)">' + esc(e.message) + '</div>';
      return;
    }

    var deep = parseToolId(location.href, true);
    if (deep) addScanned(deep);
  }

  main();
})();
</script>
</body>
</html>
